[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedci"
version = "0.1.0"
description = "DML project: Q1 aggregate equity response to Fed surprises, plus the web app and viewer."
requires-python = ">=3.11"
dependencies = [
    "fedcore",
    "streamlit>=1.40",
    "plotly>=5.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "seaborn>=0.13",
]

[project.optional-dependencies]
model = ["statsmodels>=0.14", "scikit-learn>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
fedci = "fedci.cli:main"

[tool.setuptools.packages.find]
include = ["fedci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
