[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedviz"
version = "0.1.0"
description = "Generalized visualization suite for FOMC causal inference models"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "streamlit>=1.28",
    "duckdb>=0.9",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
fedviz = "fedviz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fedviz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
fedviz = ["assets/*.svg"]
