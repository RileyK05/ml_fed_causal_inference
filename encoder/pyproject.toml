[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedenc"
version = "0.1.0"
description = "Q3 two-part patch-transformer model (a + b x shock) and its diagnostics."
requires-python = ">=3.11"
dependencies = ["fedcore"]

[project.optional-dependencies]
dl = ["torch>=2.2", "lightgbm>=4"]
# v5 fundamentals tower (EmbeddingGemma 2 needs transformers 5.20+)
text = ["transformers>=5.20", "huggingface_hub>=1.0", "lxml>=5", "beautifulsoup4>=4.12"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fedenc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
