[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedenc"
version = "0.1.0"
description = "Patch-transformer firm-state encoder for Q3 (firm Fed sensitivity b(z))."
requires-python = ">=3.11"
dependencies = ["fedcore"]

[project.optional-dependencies]
dl = ["torch>=2.2", "lightgbm>=4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fedenc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
