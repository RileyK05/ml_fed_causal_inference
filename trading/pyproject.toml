[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedtrade"
version = "0.1.0"
description = "Post-meeting trades built on frozen Q3 rate-sensitivity predictions (Q4/Q5)."
requires-python = ">=3.11"
dependencies = ["fedcore"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fedtrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
