[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcde"
version = "0.1.0"
description = "Neural CDE firm-state encoder for Q3, plus the signature + ridge baseline."
requires-python = ">=3.11"
dependencies = ["fedcore"]

[project.optional-dependencies]
dl = ["torch>=2.2", "lightgbm>=4", "torchcde>=0.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fedcde*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
